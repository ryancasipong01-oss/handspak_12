{% extends "base.html" %}

{% block title %}
Register - HandSpeak
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create HandSpeak Account</h1>

    <p>
        Register to use the HandSpeak gesture translator.
    </p>

    <form method="POST" action="{{ url_for('register') }}">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            minlength="6"
            required
        >


        <label for="confirm_password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm password"
            minlength="6"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <p class="form-footer">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login here
        </a>

    </p>

</div>


<script>

const form = document.querySelector("form");

form.addEventListener("submit", function(event) {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm_password").value;

    if (password !== confirmPassword) {

        event.preventDefault();

        alert("Passwords do not match.");

    }

});

</script>

{% endblock %}
